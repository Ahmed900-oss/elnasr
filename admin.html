<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم معمل النصر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--pri:#1B3A5C;--gold:#C8A45A;--bg:#F5F5F5;--bd:#e3e7eb}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:#1d2733}
.box{max-width:380px;margin:12vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0002;display:grid;gap:12px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--gold);color:#fff;font-weight:700}
.bar{background:var(--pri);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
.wrap{max-width:1150px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stats div{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 3px 10px #0001}.stats b{display:block;font-size:1.8rem;color:var(--pri)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tabs button{background:#fff;color:var(--pri);border:1px solid var(--bd)}.tabs .on{background:var(--pri);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input,.tools select{width:auto;flex:1;min-width:140px}
.tw{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 3px 10px #0001}table{border-collapse:collapse;width:100%;min-width:780px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--bd);font-size:.92rem;vertical-align:top}th{background:#eef2f6;color:var(--pri)}
.del{background:#c0392b;padding:5px 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 10px #0001;display:grid;gap:8px}.card img{width:100%;max-height:200px;object-fit:cover;border-radius:10px}
#lbx{position:fixed;inset:0;background:#000d;display:grid;place-items:center;z-index:50;cursor:zoom-out}#lbx img{max-width:95%;max-height:95%}
td input[type=checkbox]{width:auto}td input{min-width:90px}.hint{background:#fff8e6;border:1px solid var(--gold);border-radius:10px;padding:10px;margin-bottom:10px}
.err{color:#c0392b;min-height:1.2em}a{color:var(--pri)}[hidden]{display:none!important}
</style>
</head>
<body>
<form id="login" class="box"><h2 style="margin:0;color:var(--pri)">لوحة تحكم معمل النصر</h2>
<input id="em" type="text" placeholder="اسم المستخدم" autocomplete="username" autocapitalize="none" required>
<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
<div class="err" id="le"></div><button>تسجيل الدخول</button></form>

<div id="app" hidden>
<div class="bar"><b>🧪 لوحة تحكم معمل النصر</b><button id="out">خروج</button></div>
<div class="wrap">
<div class="stats"><div><b id="s1">0</b>إجمالي الحجوزات</div><div><b id="s2">0</b>قيد الانتظار</div><div><b id="s3">0</b>حجوزات اليوم</div><div><b id="s4">0</b>الروشتات</div></div>
<div class="tabs"><button data-t="tb" class="on">الحجوزات</button><button data-t="tr">الروشتات</button><button data-t="ct">التحاليل والأسعار</button><button data-t="cp">الباقات</button><button data-t="bl">المقالات</button><button data-t="py">المدفوعات</button></div>
<section id="tb"><div class="tools"><input id="q" placeholder="بحث بالاسم أو الرقم…"><select id="fs"><option value="">كل الحالات</option></select><button id="csv">تصدير CSV</button></div>
<div class="tw"><table><thead><tr><th>التاريخ</th><th>الاسم</th><th>الجوال</th><th>الخدمة</th><th>موعد الزيارة</th><th>المطلوب</th><th>الحالة</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="tr" hidden><div class="grid" id="rx"></div></section>
<section id="ct" hidden></section><section id="cp" hidden></section><section id="bl" hidden></section><section id="py" hidden><div class="grid" id="pyg"></div></section>
</div></div>

<div id="lbx" hidden onclick="this.hidden=true"><img alt=""></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* املأ بيانات مشروع Firebase هنا (Project settings > Your apps > Web app) */
const CFG={apiKey:'AIzaSyDqS3L85rELhsop5kONR33dkjsiH_HIFbI',authDomain:'elnasr-4046d.firebaseapp.com',projectId:'elnasr-4046d'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={pending:'قيد الانتظار',confirmed:'مؤكد',done:'تم',cancelled:'ملغي'};
const opts=v=>Object.entries(ST).map(([k,t])=>`<option value="${k}"${v===k?' selected':''}>${t}</option>`).join('');
$('#fs').insertAdjacentHTML('beforeend',opts(''));
const dt=t=>t&&t.toDate?t.toDate().toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'';
const SV=v=>v==='home'?'زيارة منزلية':v==='results'?'طلب نتيجة':'في المعمل';
const wa=p=>'https://wa.me/2'+String(p).replace(/\D/g,'');
const FLD={tests:[['ar','الاسم (عربي)'],['en','Name (EN)'],['price','السعر (ج.م)',1],['ta','مدة النتيجة (عربي)'],['te','Turnaround (EN)']],packages:[['ar','اسم الباقة (عربي)'],['en','Name (EN)'],['price','السعر (ج.م)',1],['old','السعر قبل الخصم',1],['da','المحتوى (عربي)'],['de','Contents (EN)']]};
const SEED={tests:[['صورة دم كاملة CBC','CBC',120,'نفس اليوم','Same day'],['سكر صائم','Fasting glucose',50,'نفس اليوم','Same day'],['سكر تراكمي HbA1c','HbA1c',180,'نفس اليوم','Same day'],['فيتامين د','Vitamin D',350,'يوم واحد','1 day'],['وظائف الغدة الدرقية TSH','Thyroid TSH',160,'يوم واحد','1 day'],['وظائف الكبد','Liver function',200,'نفس اليوم','Same day'],['وظائف الكلى','Kidney function',180,'نفس اليوم','Same day'],['تحليل بول كامل','Urine analysis',60,'نفس اليوم','Same day']],
packages:[['باقة الفحص الأساسي','Basic checkup',350,500,'صورة دم، سكر، كوليسترول','CBC, glucose, cholesterol'],['باقة صحة القلب','Heart health',600,800,'دهون، CRP، وظائف قلب','Lipids, CRP, cardiac panel'],['باقة الفيتامينات','Vitamins',450,600,'فيتامين د، B12، حديد','Vit D, B12, iron'],['الباقة الشاملة','Comprehensive',1200,1600,'+40 تحليل شامل','40+ tests']]};
const CAT={tests:[],packages:[]};
function initC(k){const F=FLD[k];$(k==='tests'?'#ct':'#cp').innerHTML=`<div class="hint">أضف عنصراً جديداً من الصف التالي. لتعديل أي سعر أو اسم غيّر القيمة في الجدول واضغط Enter أو اضغط خارج الخانة وسيُحفظ تلقائياً.</div><form class="tools" data-k="${k}">${F.map(f=>`<input name="${f[0]}" placeholder="${f[1]}" ${f[2]?'type="number" min="0" step="any"':''}${['ar','price','name','rating'].includes(f[0])?' required':''}>`).join('')}<button>إضافة</button></form><div class="tw" id="w-${k}"></div>`}
function drawC(k){const F=FLD[k],rows=CAT[k].map(x=>`<tr>${F.map(f=>`<td><input data-k="${k}" data-id="${x.id}" data-f="${f[0]}" ${f[2]?'type="number" min="0" step="any"':''} value="${esc(x[f[0]]==null?'':x[f[0]])}"></td>`).join('')}<td><input type="checkbox" data-k="${k}" data-id="${x.id}" data-f="active" ${x.active===false?'':'checked'}></td><td><button class="del" data-c="${k}" data-del="${x.id}">حذف</button></td></tr>`).join('');
$('#w-'+k).innerHTML=`<table><thead><tr>${F.map(f=>`<th>${f[1]}</th>`).join('')}<th>ظاهر في الموقع</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="9">لا توجد عناصر بعد. ${SEED[k]?`<button data-seed="${k}">استيراد القائمة الحالية من الموقع</button>`:''}</td></tr>`}</tbody></table>`}
initC('tests');initC('packages');
let PS=[],ED=null,IM=null;
function shrinkImg(f,max,lim){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const r=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>lim&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};i.onerror=rej;i.src=u})}
const IMG=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
function initP(){$('#bl').innerHTML=`<div class="hint">اكتب المقال بالعربي (والإنجليزي اختياري). كل سطر جديد يظهر كفقرة منفصلة في الموقع. صورة الغلاف اختيارية.</div><form id="pf" class="box" style="max-width:none;margin:0 0 14px;gap:8px"><input name="ta" placeholder="عنوان المقال (عربي)" required><input name="te" placeholder="Title (EN, optional)"><input name="cat" placeholder="التصنيف (مثال: تغذية)"><textarea name="ba" rows="6" placeholder="نص المقال (عربي)" required></textarea><textarea name="be" rows="4" placeholder="Article text (EN, optional)"></textarea><input type="file" id="pi" accept="image/*"><div id="pp"></div><div style="display:flex;gap:8px"><button id="ps">نشر المقال</button><button type="button" id="pc" hidden>إلغاء التعديل</button></div><div class="err" id="pe"></div></form><div class="grid" id="pg"></div>`}
function drawP(){$('#pg').innerHTML=PS.map(p=>{const im=IMG.test(p.img||'')?p.img:'';return `<div class="card">${im?`<img src="${im}" alt="">`:''}<b>${esc(p.ta)}</b><small>${esc(p.cat)}</small><label><input type="checkbox" data-pa="${p.id}" ${p.active===false?'':'checked'} style="width:auto"> منشور</label><div style="display:flex;gap:8px"><button data-pe="${p.id}">تعديل</button><button class="del" data-c="posts" data-del="${p.id}">حذف</button></div></div>`}).join('')||'<p>لا توجد مقالات بعد.</p>'}
function resetP(){$('#pf').reset();ED=null;IM=null;$('#pp').innerHTML='';$('#pc').hidden=true;$('#ps').textContent='نشر المقال'}
initP();
let B=[],R=[],PY=[];
if(!CFG.apiKey){$('#le').textContent='املأ إعدادات Firebase (CFG) في أول الملف أولاً.'}
else{
firebase.initializeApp(CFG);const auth=firebase.auth(),db=firebase.firestore();let un=[];
$('#login').onsubmit=e=>{e.preventDefault();$('#le').textContent='';auth.signInWithEmailAndPassword((v=>v.includes('@')?v:v+'@elnasr-lab.com')($('#em').value.trim().toLowerCase()),$('#pw').value).catch(()=>$('#le').textContent='بيانات الدخول غير صحيحة')};
$('#out').onclick=()=>auth.signOut();
const cs=k=>db.collection(k).orderBy('ord').onSnapshot(s=>{CAT[k]=s.docs.map(d=>({id:d.id,...d.data()}));drawC(k)},e=>console.error(k,e));
const sub=(c,fn,n)=>db.collection(c).orderBy('createdAt','desc').limit(n).onSnapshot(s=>fn(s.docs.map(d=>({id:d.id,...d.data()}))),e=>console.error(c,e)||(window._ea=window._ea||{})[c]||((window._ea[c]=1)&&alert('خطأ في القراءة ('+c+'): '+e.message)));
auth.onAuthStateChanged(u=>{$('#login').hidden=!!u;$('#app').hidden=!u;un.forEach(f=>f());un=[];
if(u)un=[sub('bookings',l=>{B=l;drawB()},500),sub('prescriptions',l=>{R=l;drawR()},60),cs('tests'),cs('packages'),sub('payments',l=>{PY=l;drawY()},100),db.collection('posts').orderBy('ord','desc').onSnapshot(q=>{PS=q.docs.map(d=>({id:d.id,...d.data()}));drawP()},e=>console.error('posts',e))]});
document.addEventListener('change',e=>{const s=e.target.closest('select[data-id]');if(s)db.collection(s.dataset.c).doc(s.dataset.id).update({status:s.value})});
document.addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d&&confirm('حذف هذا العنصر نهائياً؟'))db.collection(d.dataset.c).doc(d.dataset.del).delete()});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-k]');if(!f)return;e.preventDefault();const k=f.dataset.k,o={active:true,ord:Date.now()};
FLD[k].forEach(x=>{const v=f.elements[x[0]].value.trim();o[x[0]]=x[2]?Number(v||0):v});if(!(o.ar||o.name))return;db.collection(k).add(o).then(()=>f.reset()).catch(er=>alert('تعذر الحفظ: '+er.message))});
document.addEventListener('change',e=>{const i=e.target.closest('input[data-f]');if(!i)return;let v=i.type==='checkbox'?i.checked:i.type==='number'?Number(i.value||0):i.value.trim();db.collection(i.dataset.k).doc(i.dataset.id).update({[i.dataset.f]:v}).catch(er=>alert('تعذر الحفظ: '+er.message))});
document.addEventListener('click',e=>{const b=e.target.closest('[data-seed]');if(!b)return;const k=b.dataset.seed,bt=db.batch();SEED[k].forEach((r,i)=>{const o={ord:i,active:true};FLD[k].forEach((f,j)=>o[f[0]]=r[j]);bt.set(db.collection(k).doc(),o)});bt.commit().catch(er=>alert('تعذر الاستيراد: '+er.message))});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id==='pi'&&t.files[0]){try{IM=await shrinkImg(t.files[0],640,90000);$('#pp').innerHTML='<img src="'+IM+'" alt="" style="max-width:200px;border-radius:10px">'}catch(x){IM=null;$('#pe').textContent='تعذر قراءة الصورة، جرّب صورة JPG أو PNG.'}}
if(t.dataset&&t.dataset.pa)db.collection('posts').doc(t.dataset.pa).update({active:t.checked})});
document.addEventListener('submit',e=>{if(e.target.id!=='pf')return;e.preventDefault();const f=e.target.elements,o={};['ta','te','cat','ba','be'].forEach(k=>o[k]=f[k].value.trim());if(IM)o.img=IM;
const r=ED?db.collection('posts').doc(ED).update(o):db.collection('posts').add({...o,active:true,ord:Date.now()});
r.then(()=>{$('#pe').textContent='';resetP()}).catch(er=>$('#pe').textContent='تعذر الحفظ: '+er.message)});
document.addEventListener('click',e=>{if(e.target.id==='pc')return resetP();const b=e.target.closest('[data-pe]');if(!b)return;const p=PS.find(x=>x.id===b.dataset.pe);if(!p)return;ED=p.id;IM=null;const f=$('#pf').elements;['ta','te','cat','ba','be'].forEach(k=>f[k].value=p[k]||'');$('#pp').innerHTML=IMG.test(p.img||'')?'<img src="'+p.img+'" alt="" style="max-width:200px;border-radius:10px"><small> (اختر صورة جديدة لتغييرها)</small>':'';$('#pc').hidden=false;$('#ps').textContent='حفظ التعديل';$('#pf').scrollIntoView({behavior:'smooth'})});


}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['tb','tr','ct','cp','bl','py'].forEach(i=>$('#'+i).hidden=i!==b.dataset.t)});
$('#q').oninput=$('#fs').onchange=()=>drawB();
function drawB(){const q=$('#q').value.trim().toLowerCase(),f=$('#fs').value,td=new Date().toDateString();
$('#s1').textContent=B.length;$('#s2').textContent=B.filter(b=>b.status==='pending').length;$('#s3').textContent=B.filter(b=>b.createdAt&&b.createdAt.toDate&&b.createdAt.toDate().toDateString()===td).length;
$('#rows').innerHTML=B.filter(b=>(!f||b.status===f)&&(!q||((b.name||'')+(b.phone||'')).toLowerCase().includes(q))).map(b=>`<tr><td>${dt(b.createdAt)}</td><td>${esc(b.name)}</td><td dir="ltr"><a href="${wa(b.phone)}" target="_blank" rel="noopener">${esc(b.phone)}</a></td><td>${SV(b.service)}</td><td>${esc(b.date)}</td><td>${esc(b.tests)}${b.msg?'<br><small>'+esc(b.msg)+'</small>':''}</td><td><select data-c="bookings" data-id="${b.id}">${opts(b.status)}</select></td><td><button class="del" data-c="bookings" data-del="${b.id}">حذف</button></td></tr>`).join('')||'<tr><td colspan="8">لا توجد حجوزات.</td></tr>'}
function drawY(){$('#pyg').innerHTML=PY.map(r=>{const im=IMG.test(r.img||'')?r.img:'';return `<div class="card">${im?`<img src="${im}" alt="تحويل" style="cursor:zoom-in">`:''}<b>${esc(r.name)}</b><a dir="ltr" href="${wa(r.phone)}" target="_blank" rel="noopener">${esc(r.phone)}</a><div><b>${esc(r.amount)} ج.م</b> · ${esc(r.method)}</div><small>${dt(r.createdAt)}</small><select data-c="payments" data-id="${r.id}">${opts(r.status)}</select><button class="del" data-c="payments" data-del="${r.id}">حذف</button></div>`}).join('')||'<p>لا توجد مدفوعات مسجّلة.</p>'}
function drawR(){$('#s4').textContent=R.length;
$('#rx').innerHTML=R.map(r=>{const im=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(r.img||'')?r.img:'',ok=/^https:\/\/res\.cloudinary\.com\//.test(r.url||'');
return `<div class="card">${im?`<img src="${im}" alt="روشتة" style="cursor:zoom-in">`:''}<b>${esc(r.name)}</b><a dir="ltr" href="${wa(r.phone)}" target="_blank" rel="noopener">${esc(r.phone)}</a><small>${dt(r.createdAt)}</small>${im?`<a download="prescription-${esc(r.id)}.jpg" href="${im}">تحميل الصورة</a>`:''}${ok?`<a href="${esc(r.url)}" target="_blank" rel="noopener">فتح الروشتة</a>`:''}<select data-c="prescriptions" data-id="${r.id}">${opts(r.status)}</select><button class="del" data-c="prescriptions" data-del="${r.id}">حذف</button></div>`}).join('')||'<p>لا توجد روشتات.</p>'}
document.addEventListener('click',e=>{const i=e.target.closest('#rx img,#pyg img');if(i){$('#lbx img').src=i.src;$('#lbx').hidden=false}});
$('#csv').onclick=()=>{const c=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
const rows=[['التاريخ','الاسم','الجوال','الخدمة','موعد الزيارة','المطلوب','الحالة']].concat(B.map(b=>[dt(b.createdAt),b.name,b.phone,SV(b.service),b.date,b.tests,ST[b.status]||b.status]));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c).join(',')).join('\n')],{type:'text/csv'}));a.download='bookings.csv';a.click()};
</script>
</body>
</html>
